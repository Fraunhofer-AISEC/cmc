[log]
level = "trace"

[api]
endpoint = "socket://localhost:9955"

[trust]
root_cas = ["../../data/pki/ca.pem"]

[cmc.attestation]
drivers = ["tpm", "sw"]
hash_alg = "sha256"
measurement_logs = true

[cmc.attestation.tpm]
key_alg = "ec256"
exclude_pcrs = []

[cmc.attestation.containers]
driver = "sw"
log = "/tmp/container_measurements"

[cmc.metadata]
locations = ["file://../../data/metadata-signed"]

[cmc.metadata.omsp]
enabled = false

[cmc.provisioning]
auth = ["attestation"]
token = "../../data/provision_token"
endorsement = "est:https://localhost:9000/"
enrollment = "est:https://localhost:9000/"

[cmc.policies]
engine = "js"
allow_overwrite = false

[cmc.storage]
data = "../../data/cmc-internal"
