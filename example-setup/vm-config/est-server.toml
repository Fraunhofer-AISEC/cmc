[log]
level = "trace"

[trust]
root_cas = ["../../data/pki/ca.pem", "metadata-ca.pem"]

[est]
ca_key = "../../data/pki/ca-key.pem"
ca_chain = ["../../data/pki/ca.pem"]
tls_key = "../../data/pki/est-tls-key.pem"
tls_ca_chain = ["../../data/pki/est-tls.pem", "../../data/pki/ca.pem"]

[est.auth]
simpleenroll = ["none"]
tpmactivateenroll = ["none"]
tpmcertifyenroll = ["none"]
attestenroll = ["none"]

[http]
folder = "vm-metadata"

[tpm]
verify_ek_cert = false
ek_cert_db = "../../data/tpm-ek-certs.db"

[omsp]
folder = "../../data/omsp-raw"
key = "../../data/pki/omsp-key.pem"
ca_chain = ["../../data/pki/omsp.pem", "../../data/pki/ca.pem"]
url = "https://10.0.2.2:9000/omsp"
