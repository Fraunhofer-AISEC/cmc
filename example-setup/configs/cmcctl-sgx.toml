[log]
level = "trace"

[api]
endpoint = "libapi"

[trust]
root_cas = ["../../data/pki/ca.pem"]

[files]
report = "../../data/attestation-report"
nonce = "../../data/nonce"
ca_store = "../../data/pki/ca.pem"

[publish]
result = "../../data/attestation-result.json"
results = "http://nuc-02.sos.aisec.fraunhofer.de:8080/results"

[cmc.attestation]
drivers = ["sgx"]

[cmc.metadata]
locations = ["file://../../data/metadata-signed"]

[cmc.provisioning]
auth = ["none"]
token = "../../data/provision_token"
enrollment = "est:https://localhost:9000/"

[cmc.storage]
data = "../../data/cmcctl-internal"
