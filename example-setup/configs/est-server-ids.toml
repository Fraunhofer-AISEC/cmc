[log]
level = "trace"

[trust]
root_cas = ["../../data/pki/ca.pem"]

[est]
ca_key = "../../data-ids/pki/device_sub_ca-key.pem"
ca_chain = ["../../data-ids/pki/device_sub_ca.pem", "../../data-ids/pki/ca.pem"]
tls_key = "../../data-ids/pki/est-tls-key.pem"
tls_ca_chain = ["../../data-ids/pki/est-tls.pem", "../../data-ids/pki/ca.pem"]

[http]
folder = "../../data-ids/"

[tpm]
verify_ek_cert = false
ek_cert_db = "../../data-ids/tpm-ek-certs.db"

[omsp]
folder = "../../data/omsp-raw"
key = "../../data/pki/omsp-key.pem"
ca_chain = ["../../data/pki/omsp.pem", "../../data/pki/ca.pem"]
url = "https://localhost:9000/omsp"

[storage]
vendor_cache = "../../data/est-server-vendor-cache"
