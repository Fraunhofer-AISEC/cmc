[log]
level = "trace"

[api]
endpoint = "socket://127.0.0.1:9955"

[trust]
root_cas = ["../../data/pki/ca.pem"]

[cmc.attestation]
drivers = ["tpm", "sw"]

[cmc.attestation.containers]
trust_anchor = "sw"

[cmc.metadata]
locations = ["file://../../data/metadata-signed"]

[cmc.provisioning]
endorsement = "est:https://localhost:9000/"
enrollment = "est:https://localhost:9000/"

[cmc.policies]
engine = "js"

[cmc.storage]
data = "../../data/cmc-internal"
