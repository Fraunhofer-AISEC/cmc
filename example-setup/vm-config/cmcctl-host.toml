[log]
level = "trace"

[api]
endpoint = "socket://localhost:9955"
serialization = "json"

[trust]
root_cas = ["../../data/pki/ca.pem"]

[atls]
addr = "https://ubuntu:4443"
mtls = false
attest = "server"

[identity]
key_id = "../../data/key_id"
key_type = "sw"
key_config = "ec256"

[files]
report = "../../data/attestation-report"
nonce = "../../data/nonce"
ca_store = "../../data/pki/ca.pem"

[publish]
result = "../../data/attestation-result.json"
